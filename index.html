<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>geniusdrawing Firebase 管理員登入測試</title><style>body{font:16px system-ui,sans-serif;background:#f1f5f9;color:#0f172a;padding:36px}main{max-width:620px;margin:auto;background:white;border-radius:16px;padding:28px;box-shadow:0 8px 30px #0001}button{background:#2563eb;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;background:#f8fafc;padding:15px;border-radius:8px}small{color:#64748b}</style></head><body><main><h1>geniusdrawing</h1><p>Firebase Google 登入與管理員 UID 測試</p><button id="login">使用 Google 登入</button> <button id="logout" style="background:#64748b">登出</button><pre id="result">尚未登入</pre><small>此頁只用於建立第一個管理員，不會上傳船圖或修改 Firestore。請勿公開分享登入資訊。</small></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
const firebaseConfig={apiKey:'AIzaSyBKbISIBc8sE2djJrlO8gXZHGbx1YeuR9Q',authDomain:'geniusdrawing-b2583.firebaseapp.com',projectId:'geniusdrawing-b2583',storageBucket:'geniusdrawing-b2583.firebasestorage.app',messagingSenderId:'1042921319023',appId:'1:1042921319023:web:752a37fc05a3c3b03cfb9a'};
const auth=getAuth(initializeApp(firebaseConfig));const out=document.getElementById('result');
onAuthStateChanged(auth,u=>{out.textContent=u?`登入成功\nEmail: ${u.email}\nUID: ${u.uid}\n\n請到 Firestore 建立 users/${u.uid} 文件，role=admin，active=true。`:'尚未登入';});
document.getElementById('login').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){out.textContent=`登入失敗：${e.code}\n${e.message}\n\n請確認已啟用 Google 登入、此頁所在網域已加入 Authentication 的 Authorized domains，並使用 HTTPS 或 localhost 開啟。`}};
document.getElementById('logout').onclick=()=>signOut(auth);
</script></body></html>
